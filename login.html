<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Admin - Klinix</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='9' fill='%23139c8c'/%3E%3Cpath d='M3 21 H12 L15.5 12 L20.5 30 L24 21 H30' fill='none' stroke='white' stroke-width='3.4' stroke-linecap='round' stroke-linejoin='round'/%3E%3Ccircle cx='33' cy='21' r='3' fill='white'/%3E%3C/svg%3E">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>body { font-family: 'Plus Jakarta Sans', sans-serif; }</style>
</head>
<body class="bg-slate-50 text-slate-800 antialiased min-h-screen flex items-center justify-center px-4">

    <div class="w-full max-w-sm">
        <div class="flex flex-col items-center mb-8">
            <div class="w-14 h-14 rounded-2xl flex items-center justify-center shadow-lg shadow-teal-600/30 bg-gradient-to-br from-teal-500 to-emerald-600 p-2.5 mb-4">
                <svg viewBox="0 0 40 40" class="w-full h-full" xmlns="http://www.w3.org/2000/svg">
                    <path d="M3 21 H12 L15.5 12 L20.5 30 L24 21 H30" fill="none" stroke="white" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>
                    <circle cx="33" cy="21" r="3" fill="white"/>
                </svg>
            </div>
            <span class="text-2xl font-bold bg-gradient-to-r from-teal-600 to-emerald-600 bg-clip-text text-transparent">Klinix</span>
            <p class="text-slate-400 text-sm mt-1">Masuk ke Panel Admin</p>
        </div>

        <form id="login-form" onsubmit="loginAdmin(event)" class="bg-white p-6 md:p-8 rounded-3xl border border-slate-100 shadow-xl shadow-slate-100 space-y-4">
            <div>
                <label class="block text-xs font-semibold text-slate-600 mb-1">Email</label>
                <input type="email" id="login-email" required autocomplete="username" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-teal-500 bg-white text-sm" placeholder="admin@klinix.com">
            </div>
            <div>
                <label class="block text-xs font-semibold text-slate-600 mb-1">Kata Sandi</label>
                <input type="password" id="login-password" required autocomplete="current-password" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-teal-500 bg-white text-sm" placeholder="••••••••">
            </div>
            <p id="login-error" class="text-rose-500 text-xs hidden"></p>
            <button type="submit" id="login-button" class="w-full py-3 bg-teal-600 hover:bg-teal-700 text-white font-semibold rounded-xl shadow-lg shadow-teal-600/30 transition cursor-pointer">
                Masuk
            </button>
        </form>

        <p class="text-center text-xs text-slate-400 mt-6">
            Akun admin dibuat lewat dashboard Supabase (Authentication → Users), bukan lewat halaman ini.
        </p>
    </div>

    <script>
        const SUPABASE_URL = "https://owliugdusdvcjuzfyelu.supabase.co";
        const SUPABASE_ANON_KEY = "sb_publishable_4FOxl1CSx0j1K1WkC7xNAA_8dl-M1eZ";

        const { createClient } = supabase;
        const _supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // Kalau sudah login sebelumnya, langsung lempar ke admin.html
        document.addEventListener("DOMContentLoaded", async () => {
            const { data } = await _supabase.auth.getSession();
            if (data.session) {
                window.location.href = "admin.html";
            }
        });

        async function loginAdmin(event) {
            event.preventDefault();
            const email = document.getElementById('login-email').value.trim();
            const password = document.getElementById('login-password').value;
            const errorEl = document.getElementById('login-error');
            const button = document.getElementById('login-button');

            errorEl.classList.add('hidden');
            button.disabled = true;
            button.textContent = "Memproses...";

            const { error } = await _supabase.auth.signInWithPassword({ email, password });

            if (error) {
                errorEl.textContent = "Email atau kata sandi salah. Coba lagi.";
                errorEl.classList.remove('hidden');
                button.disabled = false;
                button.textContent = "Masuk";
                return;
            }

            window.location.href = "admin.html";
        }
    </script>
</body>
</html>
