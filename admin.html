<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - SehatCare</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Supabase JS SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen p-6">

    <div class="max-w-4xl mx-auto">
        <!-- Header Admin -->
        <div class="flex justify-between items-center mb-8 bg-white p-6 rounded-3xl shadow-sm border border-slate-200">
            <div>
                <h1 class="text-2xl font-black text-slate-900">Panel Admin SehatCare</h1>
                <p class="text-xs text-slate-400">Kelola data layanan yang tersinkronisasi global</p>
            </div>
            <a href="index.html" class="px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-bold rounded-xl transition">Lihat Website</a>
        </div>

        <!-- Form Tambah Layanan -->
        <div class="bg-white p-6 rounded-3xl shadow-sm border border-slate-200 mb-8">
            <h2 class="text-lg font-bold text-slate-900 mb-4">Tambah Layanan Baru</h2>
            <form onsubmit="tambahLayanan(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-bold text-slate-600 uppercase mb-1">Nama Layanan</label>
                    <input type="text" id="admin-nama" required class="w-full px-4 py-2.5 rounded-xl border border-slate-200 text-sm focus:ring-2 focus:ring-teal-500 focus:outline-none">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-600 uppercase mb-1">Harga (Rupiah)</label>
                    <input type="number" id="admin-harga" required class="w-full px-4 py-2.5 rounded-xl border border-slate-200 text-sm focus:ring-2 focus:ring-teal-500 focus:outline-none">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-600 uppercase mb-1">Deskripsi Singkat</label>
                    <textarea id="admin-deskripsi" rows="2" required class="w-full px-4 py-2.5 rounded-xl border border-slate-200 text-sm focus:ring-2 focus:ring-teal-500 focus:outline-none"></textarea>
                </div>
                <button type="submit" class="px-6 py-2.5 bg-teal-600 hover:bg-teal-700 text-white font-bold rounded-xl text-sm shadow-md transition">
                    Simpan ke Cloud Supabase
                </button>
            </form>
        </div>

        <!-- Daftar Layanan Tersimpan -->
        <div class="bg-white p-6 rounded-3xl shadow-sm border border-slate-200">
            <h2 class="text-lg font-bold text-slate-900 mb-4">Daftar Layanan Aktif</h2>
            <div id="admin-services-list" class="space-y-3">
                <p class="text-slate-400 text-sm">Memuat data...</p>
            </div>
        </div>
    </div>

    <!-- Skrip Admin Supabase -->
    <script>
        const SUPABASE_URL = "https://owliugdusdvcjuzfyelu.supabase.co";
        const SUPABASE_ANON_KEY = "sb_publishable_4FOxl1CSx0j1K1WkC7xNAA_8dl-M1eZ";
        
        const { createClient } = supabase;
        const _supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        document.addEventListener("DOMContentLoaded", fetchAdminServices);

        async function fetchAdminServices() {
            const listContainer = document.getElementById('admin-services-list');
            const { data, error } = await _supabase.from('services').select('*');
            
            if (error) {
                listContainer.innerHTML = `<p class="text-red-500 text-sm">Gagal memuat data: ${error.message}</p>`;
                return;
            }

            listContainer.innerHTML = '';
            if (data.length === 0) {
                listContainer.innerHTML = `<p class="text-slate-400 text-sm">Belum ada layanan yang ditambahkan.</p>";`;
                return;
            }

            data.forEach(s => {
                const formattedHarga = new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', maximumFractionDigits: 0 }).format(s.harga);
                listContainer.innerHTML += `
                    <div class="flex justify-between items-center p-4 rounded-2xl border border-slate-100 bg-slate-50">
                        <div>
                            <h3 class="font-bold text-slate-900">${s.nama} <span class="text-teal-600 font-semibold text-sm">(${formattedHarga})</span></h3>
                            <p class="text-slate-500 text-xs">${s.deskripsi}</p>
                        </div>
                        <button onclick="hapusLayanan(${s.id})" class="px-3 py-1.5 bg-red-50 hover:bg-red-100 text-red-600 text-xs font-bold rounded-lg transition">
                            Hapus
                        </button>
                    </div>
                `;
            });
        }

        async function tambahLayanan(event) {
            event.preventDefault();
            const nama = document.getElementById('admin-nama').value;
            const harga = parseFloat(document.getElementById('admin-harga').value);
            const deskripsi = document.getElementById('admin-deskripsi').value;

            const { error } = await _supabase.from('services').insert([{ nama, harga, deskripsi }]);
            
            if (error) {
                alert("Gagal menyimpan: " + error.message);
            } else {
                alert("Layanan berhasil ditambahkan ke cloud database!");
                document.getElementById('admin-nama').value = '';
                document.getElementById('admin-harga').value = '';
                document.getElementById('admin-deskripsi').value = '';
                fetchAdminServices();
            }
        }

        async function hapusLayanan(id) {
            if (confirm("Yakin ingin menghapus layanan ini?")) {
                const { error } = await _supabase.from('services').delete().eq('id', id);
                if (error) {
                    alert("Gagal menghapus: " + error.message);
                } else {
                    fetchAdminServices();
                }
            }
        }
    </script>
</body>
</html>
