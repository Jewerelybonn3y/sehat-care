<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SehatCare - Layanan Kesehatan Profesional</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- Supabase JS SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
    </style>
</head>
<body id="page-body" class="bg-slate-50 text-slate-800 antialiased transition-colors duration-500">

    <!-- Navbar -->
    <header class="sticky top-0 z-50 bg-white/80 backdrop-blur-md border-b border-slate-100">
        <div class="max-w-6xl mx-auto px-4 py-4 flex justify-between items-center">
            <div class="flex items-center space-x-2">
                <div class="w-10 h-10 bg-teal-600 rounded-xl flex items-center justify-center text-white font-bold text-xl shadow-lg shadow-teal-600/20">S</div>
                <span class="text-xl font-bold bg-gradient-to-r from-teal-600 to-emerald-600 bg-clip-text text-transparent">SehatCare</span>
            </div>
            <!-- Tombol Login Admin sengaja disembunyikan agar hanya dapat diakses melalui URL khusus oleh Admin -->
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-6xl mx-auto px-4 py-8">

        <!-- HERO BANNER SLIDER IMAGE SECTION (Ukuran 1200x350 & Sliding Effect) -->
        <section class="mb-12 relative">
            <div class="overflow-hidden rounded-3xl shadow-xl shadow-teal-900/10 relative h-[250px] md:h-[350px] bg-slate-200">
                <div id="banner-slider-wrapper" class="flex transition-transform duration-700 ease-in-out h-full w-full">
                    <!-- Dinamis -->
                </div>
            </div>
            <!-- Navigasi Slider Dot -->
            <div id="slider-dots" class="flex justify-center space-x-2 mt-4"></div>
        </section>

        <!-- Daftar Layanan -->
        <div class="mb-12">
            <h2 class="text-2xl font-bold text-slate-900 mb-6">Pilih Layanan Kesehatan</h2>
            <div id="public-services-grid" class="grid grid-cols-1 md:grid-cols-3 gap-6"></div>
        </div>

        <!-- Form Pemesanan -->
        <div class="bg-white/90 backdrop-blur-sm p-6 md:p-8 rounded-3xl border border-slate-100 shadow-xl shadow-slate-100 max-w-2xl mx-auto">
            <h3 class="text-xl font-bold text-slate-900 mb-4">Formulir Pemesanan Cepat</h3>
            <form id="booking-form" onsubmit="KirimKeWhatsApp(event)" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Nama Lengkap</label>
                    <input type="text" id="nama" required class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-teal-500 bg-white" placeholder="Contoh: Budi Santoso">
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Pilih Layanan</label>
                    <select id="layanan-pilihan" required class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-teal-500 bg-white"></select>
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Nomor WhatsApp</label>
                    <input type="tel" id="notelp" required class="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-teal-500 bg-white" placeholder="Contoh: 08123456789">
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Alamat Lengkap</label>
                    <textarea id="alamat" required rows="2" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-teal-500 text-sm bg-white" placeholder="Contoh: Jl. Merdeka No. 10, RT 01/RW 02, Kota..."></textarea>
                </div>
                <button type="submit" class="w-full py-3.5 bg-teal-600 hover:bg-teal-700 text-white font-semibold rounded-xl shadow-lg shadow-teal-600/30 transition cursor-pointer">
                    Pesan Sekarang via WhatsApp
                </button>
            </form>
        </div>
    </main>

    <!-- JavaScript Public -->
    <script>
        const SUPABASE_URL = "https://owliugdusdvcjuzfyelu.supabase.co";
        const SUPABASE_ANON_KEY = "sb_publishable_4FOxl1CSx0j1K1WkC7xNAA_8dl-M1eZ";

        const { createClient } = supabase;
        const _supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const defaultServices = [
            { id: 1, nama: "Konsultasi Dokter Umum", harga: 100000, deskripsi: "Konsultasi kesehatan komprehensif langsung dengan dokter berpengalaman." },
            { id: 2, nama: "Suntik Vitamin C", harga: 150000, deskripsi: "Meningkatkan daya tahan tubuh dan kesegaran fisik secara instan." },
            { id: 3, nama: "Sunat Modern (Cauter/Klamp)", harga: 1500000, deskripsi: "Prosedur sunat minim nyeri, cepat sembuh, dan ditangani tenaga medis ahli." }
        ];

        const defaultBanners = [
            { id: 1, image: "https://images.unsplash.com/photo-1576091160399-112ba8d25d1d?auto=format&fit=crop&w=1200&q=80" },
            { id: 2, image: "https://images.unsplash.com/photo-1505751172876-fa1923c5c528?auto=format&fit=crop&w=1200&q=80" }
        ];

        let services = [];
        let banners = [];
        let currentSlide = 0;
        let slideInterval;

        document.addEventListener("DOMContentLoaded", () => {
            ambilDataDariSupabase();
        });

        async function ambilDataDariSupabase() {
            try {
                // 1. Ambil Pengaturan Background
                const { data: setting } = await _supabase.from('settings').select('*').eq('key', 'website_bg').maybeSingle();
                if (setting) {
                    terapkanBackgroundCloud(setting.type, setting.value);
                } else {
                    terapkanBackgroundLocal();
                }

                // 2. Ambil Layanan
                const { data: hasilServices, error: errS } = await _supabase.from('services').select('*');
                if (!errS && hasilServices && hasilServices.length > 0) {
                    services = hasilServices;
                } else {
                    services = defaultServices;
                }

                // 3. Ambil Banners
                const { data: hasilBanners, error: errB } = await _supabase.from('banners').select('*');
                if (!errB && hasilBanners && hasilBanners.length > 0) {
                    banners = hasilBanners;
                } else {
                    banners = defaultBanners;
                }

                renderPublic();
                mulaiSliderOtomatis();
            } catch (err) {
                console.error("Gagal memuat data dari Supabase:", err);
                services = defaultServices;
                banners = defaultBanners;
                terapkanBackgroundLocal();
                renderPublic();
                mulaiSliderOtomatis();
            }
        }

        function terapkanBackgroundLocal() {
            const bgType = localStorage.getItem('sehatcare_bg_type');
            const bgValue = localStorage.getItem('sehatcare_bg_value');
            if (bgType && bgValue) {
                terapkanBackgroundCloud(bgType, bgValue);
            }
        }

        function terapkanBackgroundCloud(bgType, bgValue) {
            const body = document.getElementById('page-body');
            if (bgType === "color") {
                body.style.backgroundColor = bgValue;
                body.style.backgroundImage = "none";
            } else if (bgType === "image") {
                body.style.backgroundImage = `url('${bgValue}')`;
                body.style.backgroundSize = "cover";
                body.style.backgroundPosition = "center";
                body.style.backgroundAttachment = "fixed";
            }
        }

        function renderPublic() {
            const grid = document.getElementById('public-services-grid');
            const select = document.getElementById('layanan-pilihan');
            grid.innerHTML = '';
            select.innerHTML = '';

            services.forEach(s => {
                const formattedHarga = new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', maximumFractionDigits: 0 }).format(s.harga);
                grid.innerHTML += `
                    <div class="bg-white/90 backdrop-blur-sm p-6 rounded-3xl border border-slate-100 shadow-lg shadow-slate-100 flex flex-col justify-between hover:border-teal-200 transition">
                        <div>
                            <h3 class="text-lg font-bold text-slate-900 mb-1">${s.nama}</h3>
                            <p class="text-slate-500 text-sm mb-4">${s.deskripsi}</p>
                        </div>
                        <div>
                            <span class="text-xl font-extrabold text-teal-600 block mb-4">${formattedHarga}</span>
                            <button onclick="pilihCepat('${s.nama}')" class="w-full py-2.5 bg-teal-50 hover:bg-teal-100 text-teal-700 font-semibold rounded-xl text-sm transition cursor-pointer">
                                Pilih Layanan Ini
                            </button>
                        </div>
                    </div>
                `;
                select.innerHTML += `<option value="${s.nama} - ${formattedHarga}">${s.nama} (${formattedHarga})</option>`;
            });

            renderSlider();
        }

        function renderSlider() {
            const wrapper = document.getElementById('banner-slider-wrapper');
            const dotsContainer = document.getElementById('slider-dots');
            
            wrapper.innerHTML = '';
            dotsContainer.innerHTML = '';

            banners.forEach((b, index) => {
                wrapper.innerHTML += `
                    <div class="min-w-full h-full flex-shrink-0">
                        <img src="${b.image}" class="w-full h-full object-cover" alt="Banner SehatCare">
                    </div>
                `;

                const dotActive = index === currentSlide ? 'bg-teal-600 w-6' : 'bg-slate-300 w-2';
                dotsContainer.innerHTML += `
                    <button onclick="setSlide(${index})" class="h-2 rounded-full transition-all duration-300 cursor-pointer ${dotActive}"></button>
                `;
            });

            wrapper.style.transform = `translateX(-${currentSlide * 100}%)`;
        }

        function setSlide(index) {
            currentSlide = index;
            renderSlider();
            resetSliderOtomatis();
        }

        function mulaiSliderOtomatis() {
            if (slideInterval) clearInterval(slideInterval);
            slideInterval = setInterval(() => {
                if (banners.length > 0) {
                    currentSlide = (currentSlide + 1) % banners.length;
                    renderSlider();
                }
            }, 4000);
        }

        function resetSliderOtomatis() {
            clearInterval(slideInterval);
            mulaiSliderOtomatis();
        }

        function pilihCepat(nama) {
            const s = services.find(item => item.nama === nama);
            if (!s) return;
            const formattedHarga = new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', maximumFractionDigits: 0 }).format(s.harga);
            document.getElementById('layanan-pilihan').value = `${s.nama} - ${formattedHarga}`;
            window.scrollTo({ top: document.getElementById('booking-form').offsetTop - 100, behavior: 'smooth' });
        }

        function KirimKeWhatsApp(event) {
            event.preventDefault();
            const nama = document.getElementById('nama').value;
            const layanan = document.getElementById('layanan-pilihan').value;
            const notelp = document.getElementById('notelp').value;
            const alamat = document.getElementById('alamat').value;
            const nomorAdmin = "6281234567890"; // Ganti dengan nomor WhatsApp Anda
            
            const pesan = `Halo Admin SehatCare, saya ingin memesan layanan kesehatan.%0A%0A*Nama Pasien:* ${nama}%0A*Pilihan Layanan:* ${layanan}%0A*No Telepon:* ${notelp}%0A*Alamat Lengkap:* ${alamat}`;
            
            window.open(`https://wa.me/${nomorAdmin}?text=${pesan}`, '_blank');
        }
    </script>
</body>
</html>
