<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SehatCare - Layanan Kesehatan Terpadu</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Supabase JS SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body id="page-body" class="bg-slate-50 text-slate-800 min-h-screen flex flex-col justify-between font-sans transition-all">

    <!-- Header / Navbar -->
    <header class="bg-white/80 backdrop-blur-md border-b border-slate-100 sticky top-0 z-50">
        <div class="max-w-5xl mx-auto px-6 py-4 flex justify-between items-center">
            <div class="flex items-center space-x-2">
                <span class="text-2xl font-black text-teal-600 tracking-tight">Sehat<span class="text-slate-800">Care</span></span>
            </div>
            <a href="admin.html" class="text-xs font-semibold text-slate-400 hover:text-teal-600 transition">Admin Login</a>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-5xl mx-auto px-6 py-10 flex-grow w-full">
        
        <!-- Banner / Slider Section -->
        <section class="mb-12">
            <div id="banner-container" class="w-full h-48 md:h-64 rounded-3xl overflow-hidden shadow-xl bg-slate-200 relative flex items-center justify-center">
                <div class="absolute inset-0 bg-gradient-to-r from-teal-900/60 to-transparent flex items-center p-8">
                    <h1 class="text-white text-2xl md:text-4xl font-extrabold max-w-md">Kesehatan Anda Prioritas Utama Kami</h1>
                </div>
            </div>
        </section>

        <!-- Daftar Layanan Section -->
        <section class="mb-16">
            <h2 class="text-xl font-bold text-slate-900 mb-6">Pilihan Layanan Kesehatan</h2>
            <div id="public-services-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                <!-- Data akan dimuat otomatis dari Supabase -->
                <p class="text-slate-400 text-sm">Memuat data layanan...</p>
            </div>
        </section>

        <!-- Form Pendaftaran / Pemesanan -->
        <section class="bg-white p-8 rounded-3xl border border-slate-100 shadow-xl max-w-xl mx-auto">
            <h2 class="text-xl font-bold text-slate-900 mb-6 text-center">Formulir Pendaftaran Kunjungan</h2>
            <form onsubmit="KirimKeWhatsApp(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-bold text-slate-600 uppercase tracking-wider mb-2">Nama Lengkap Pasien</label>
                    <input type="text" id="nama" required class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-teal-500 text-sm">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-600 uppercase tracking-wider mb-2">Pilih Layanan</label>
                    <select id="layanan-pilihan" required class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-teal-500 text-sm bg-white">
                        <!-- Opsi layanan terisi dinamis -->
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-600 uppercase tracking-wider mb-2">Nomor Telepon / WhatsApp</label>
                    <input type="tel" id="notelp" required class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-teal-500 text-sm">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-600 uppercase tracking-wider mb-2">Alamat Lengkap</label>
                    <textarea id="alamat" rows="3" required class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-teal-500 text-sm"></textarea>
                </div>
                <button type="submit" class="w-full py-3.5 bg-teal-600 hover:bg-teal-700 text-white font-bold rounded-xl shadow-lg shadow-teal-600/20 transition cursor-pointer">
                    Kirim Pesanan via WhatsApp
                </button>
            </form>
        </section>
    </main>

    <!-- Footer -->
    <footer class="bg-white border-t border-slate-100 py-6 text-center text-xs text-slate-400">
        &copy; 2026 SehatCare. Seluruh hak cipta dilindungi.
    </footer>

    <!-- Skrip Supabase & Logika Utama -->
    <script>
        // Kunci Supabase Anda
        const SUPABASE_URL = "https://owliugdusdvcjuzfyelu.supabase.co";
        const SUPABASE_ANON_KEY = "sb_publishable_4FOxl1CSx0j1K1WkC7xNAA_8dl-M1eZ";
        
        const { createClient } = supabase;
        const _supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let services = [];

        document.addEventListener("DOMContentLoaded", async () => {
            await muatDataSupabase();
            terapkanBackground();
        });

        async function muatDataSupabase() {
            try {
                // Ambil data layanan dari Supabase
                const { data, error } = await _supabase.from('services').select('*');
                if (error) throw error;

                if (data && data.length > 0) {
                    services = data;
                } else {
                    services = [
                        { id: 1, nama: "Konsultasi Umum", harga: 100000, deskripsi: "Pemeriksaan kesehatan dasar bersama dokter." }
                    ];
                }
                renderPublic();
            } catch (err) {
                console.error("Gagal memuat dari Supabase:", err);
            }
        }

        function renderPublic() {
            const grid = document.getElementById('public-services-grid');
            const select = document.getElementById('layanan-pilihan');
            grid.innerHTML = '';
            select.innerHTML = '';

            services.forEach(s => {
                const formattedHarga = new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', maximumFractionDigits: 0 }).format(s.harga);
                grid.innerHTML += `
                    <div class="bg-white/90 backdrop-blur-sm p-6 rounded-3xl border border-slate-100 shadow-lg flex flex-col justify-between">
                        <div>
                            <h3 class="text-lg font-bold text-slate-900 mb-1">${s.nama}</h3>
                            <p class="text-slate-500 text-sm mb-4">${s.deskripsi}</p>
                        </div>
                        <div>
                            <span class="text-xl font-extrabold text-teal-600 block mb-4">${formattedHarga}</span>
                            <button onclick="pilihLayananCepat('${s.nama}')" class="w-full py-2.5 bg-teal-50 hover:bg-teal-100 text-teal-700 font-semibold rounded-xl text-sm transition">
                                Pilih Layanan Ini
                            </button>
                        </div>
                    </div>
                `;
                select.innerHTML += `<option value="${s.nama} - ${formattedHarga}">${s.nama} (${formattedHarga})</option>`;
            });
        }

        function pilihLayananCepat(namaLayanan) {
            const select = document.getElementById('layanan-pilihan');
            for (let i = 0; i < select.options.length; i++) {
                if (select.options[i].text.includes(namaLayanan)) {
                    select.selectedIndex = i;
                    break;
                }
            }
            window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
        }

        function terapkanBackground() {
            const bgType = localStorage.getItem('sehatcare_bg_type');
            const bgValue = localStorage.getItem('sehatcare_bg_value');
            const body = document.getElementById('page-body');
            
            if (bgType && bgValue) {
                if (bgType === "color") {
                    body.style.backgroundColor = bgValue;
                    body.style.backgroundImage = "none";
                } else if (bgType === "image") {
                    body.style.backgroundImage = `url('${bgValue}')`;
                    body.style.backgroundSize = "cover";
                    body.style.backgroundPosition = "center";
                }
            }
        }

        function KirimKeWhatsApp(event) {
            event.preventDefault();
            const nama = document.getElementById('nama').value;
            const layanan = document.getElementById('layanan-pilihan').value;
            const notelp = document.getElementById('notelp').value;
            const alamat = document.getElementById('alamat').value;
            const nomorAdmin = "6281234567890"; // Ganti dengan nomor WhatsApp Anda
            
            const pesan = `Halo Admin SehatCare, saya ingin mendaftar layanan kesehatan.%0A%0A*Nama Pasien:* ${nama}%0A*Pilihan Layanan:* ${layanan}%0A*No Telepon:* ${notelp}%0A*Alamat:* ${alamat}`;
            window.open(`https://wa.me/${nomorAdmin}?text=${pesan}`, '_blank');
        }
    </script>
</body>
</html>
